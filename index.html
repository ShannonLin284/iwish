<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Big Red Wishes — Cornell</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel:wght@400;600&display=swap');

    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --red:#B31B1B; --red-light:#e03030; --red-glow:#ff4444;
      --cream:#fff0f0; --bronze:#c4973a;
      --deep:#000000; --panel-h:200px;
      --serif:'Cormorant Garamond',Georgia,serif;
      --display:'Cinzel',serif;
    }

    html,body { width:100%;height:100%;overflow:hidden;background:#000000;font-family:var(--serif);color:#fff;user-select:none; }

    /* ── canvas ── */
    #sky { position:fixed;inset:0;z-index:0; }

    /* ── counter ── */
    #counter {
      position:fixed;top:0;left:0;right:0;z-index:10;
      text-align:center;padding:18px 20px 10px;
      background:linear-gradient(180deg,rgba(14,0,0,.96) 0%,transparent 100%);
      pointer-events:none;
    }
    #counter-num {
      font-family:var(--display);font-size:1.1rem;font-weight:400;letter-spacing:.18em;
      color:var(--red-light);text-shadow:0 0 24px rgba(179,27,27,.8),0 0 60px rgba(179,27,27,.3);
    }
    #counter-sub {
      font-size:.72rem;letter-spacing:.22em;color:rgba(255,160,160,.38);margin-top:3px;
      font-style:italic;
    }

    /* ── tooltip ── */
    #tooltip {
      position:fixed;z-index:30;max-width:220px;
      padding:13px 16px;pointer-events:none;
      background:linear-gradient(135deg,rgba(30,0,0,.97),rgba(14,0,0,.97));
      border:1px solid rgba(179,27,27,.35);border-radius:14px;
      box-shadow:0 0 30px rgba(179,27,27,.2);
      opacity:0;transition:opacity .22s;
    }
    #tooltip.show { opacity:1; }
    #tooltip .tt-name {
      font-family:var(--display);font-size:.68rem;letter-spacing:.12em;
      color:var(--red-light);margin-bottom:6px;
    }
    #tooltip .tt-wish { font-size:.88rem;line-height:1.55;color:rgba(255,230,230,.88);font-style:italic; }

    /* ── bottom entry panel ── */
    #panel {
      position:fixed;bottom:0;left:0;right:0;z-index:20;
      padding:20px 20px 26px;
      background:linear-gradient(0deg,rgba(14,0,0,.97) 70%,transparent 100%);
      backdrop-filter:blur(6px);
    }
    .panel-inner {
      max-width:560px;margin:0 auto;
      display:flex;flex-direction:column;gap:10px;
    }
    .panel-inner input,
    .panel-inner textarea {
      background:rgba(255,255,255,.045);
      border:1px solid rgba(179,27,27,.28);
      border-radius:40px;
      color:rgba(255,230,230,.9);
      font-family:var(--serif);font-size:.97rem;
      padding:13px 22px;outline:none;
      transition:border-color .3s,box-shadow .3s;
      caret-color:var(--red-light);
    }
    .panel-inner input::placeholder,
    .panel-inner textarea::placeholder { color:rgba(200,80,80,.38);font-style:italic; }
    .panel-inner input:focus,
    .panel-inner textarea:focus {
      border-color:rgba(179,27,27,.6);
      box-shadow:0 0 22px rgba(179,27,27,.15);
    }
    .panel-inner textarea {
      resize:none;height:52px;line-height:1.5;
      border-radius:26px;padding:13px 22px;
    }
    #release-btn {
      padding:15px;border:none;border-radius:40px;
      font-family:var(--display);font-size:.92rem;font-weight:600;letter-spacing:.18em;
      cursor:pointer;
      background:linear-gradient(135deg,#7a1010,#B31B1B,#d42020,#B31B1B,#7a1010);
      background-size:200% 100%;
      color:#fff0f0;
      box-shadow:0 4px 28px rgba(179,27,27,.55),0 0 60px rgba(179,27,27,.2);
      transition:transform .15s,box-shadow .15s,background-position .5s;
    }
    #release-btn:hover {
      transform:translateY(-2px);
      box-shadow:0 8px 36px rgba(179,27,27,.7),0 0 80px rgba(179,27,27,.3);
      background-position:100% 0;
    }
    #release-btn:active { transform:translateY(0); }

    /* ── zoom controls ── */
    #zoom-wrap {
      position:fixed;right:18px;bottom:230px;z-index:15;
      display:flex;flex-direction:column;gap:6px;
    }
    .zbtn {
      width:36px;height:36px;border-radius:50%;
      border:1px solid rgba(179,27,27,.3);background:rgba(14,0,0,.8);
      color:rgba(220,80,80,.8);font-size:1.1rem;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      transition:all .2s;backdrop-filter:blur(4px);
    }
    .zbtn:hover { background:rgba(80,0,0,.9);border-color:rgba(179,27,27,.6);transform:scale(1.1); }

    /* ── hint ── */
    #hint {
      position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:5;
      font-size:.72rem;letter-spacing:.15em;color:rgba(220,80,80,.3);
      pointer-events:none;white-space:nowrap;font-style:italic;
      animation:breathe 5s ease-in-out infinite;
    }
    @keyframes breathe{0%,100%{opacity:.28}50%{opacity:.55}}
  </style>
</head>
<body>

<canvas id="sky"></canvas>

<div id="counter">
  <div id="counter-num">Big Red Wishes: 0</div>
  <div id="counter-sub">Big Red wishes drifting through the cosmos</div>
</div>

<div id="hint">scroll to zoom · drag to wander · hover a star to read its wish</div>

<div id="tooltip">
  <div class="tt-name" id="tt-name"></div>
  <div class="tt-wish" id="tt-wish"></div>
</div>

<div id="panel">
  <div class="panel-inner">
    <input id="name-input" type="text" maxlength="40" placeholder="Your name (optional)" autocomplete="off" />
    <textarea id="wish-input" maxlength="200" placeholder="Type your wish…"></textarea>
    <button id="release-btn">✦ &nbsp; Send a Big Red Wish &nbsp; ✦</button>
  </div>
</div>

<div id="zoom-wrap">
  <button class="zbtn" id="zin">+</button>
  <button class="zbtn" id="zout">−</button>
  <button class="zbtn" id="zreset" style="font-size:.75rem">⊙</button>
</div>

<script>
// ══════════════════════════════════════════════════════
//  BIG RED WISHES — CORNELL GALAXY
// ══════════════════════════════════════════════════════
const canvas = document.getElementById('sky');
const ctx    = canvas.getContext('2d');

let W, H, frame = 0;
const PANEL_H = 210; // reserved at bottom

// ── Camera ──
let zoom = 1, panX = 0, panY = 0;
const MIN_ZOOM = 0.1, MAX_ZOOM = 5;

// ── Mouse ──
let mouseX=-9999, mouseY=-9999;
let isDragging=false, dragStart={x:0,y:0}, panStart={x:0,y:0};

// ── Data ──
let bgStars=[], nebulae=[], wishList=[], particles=[];

// ── Palette: each wish gets a "star type" ──
const STAR_TYPES = [
  { core:'#ffffff', mid:'#B31B1B', outer:'#7a1010', ring:false },
  { core:'#ffffff', mid:'#cc2020', outer:'#880000', ring:true  },
  { core:'#ffffff', mid:'#e03030', outer:'#a01010', ring:false },
  { core:'#ffffff', mid:'#B31B1B', outer:'#5a0808', ring:true  },
  { core:'#ffffff', mid:'#d42020', outer:'#8a0000', ring:false },
  { core:'#ffffff', mid:'#ff4444', outer:'#cc1010', ring:false },
];

// ────────────────────────────────────────────────────
//  HELPERS
// ────────────────────────────────────────────────────
function w2s(wx,wy){return{x:(wx-panX)*zoom+W/2,y:(wy-panY)*zoom+H/2};}
function s2w(sx,sy){return{x:(sx-W/2)/zoom+panX,y:(sy-H/2)/zoom+panY};}
function ha(hex,a){
  if(hex.length<6){const v=parseInt(hex.slice(1),16);return `rgba(${v},${v},${v},${a})`;}
  return `rgba(${parseInt(hex.slice(1,3),16)},${parseInt(hex.slice(3,5),16)},${parseInt(hex.slice(5,7),16)},${a})`;
}
function lerp(a,b,t){return a+(b-a)*t;}

// ────────────────────────────────────────────────────
//  RESIZE
// ────────────────────────────────────────────────────
function resize(){
  W=canvas.width=window.innerWidth;
  H=canvas.height=window.innerHeight;
  buildBgStars(); buildNebulae();
}
window.addEventListener('resize',resize);

function buildBgStars(){
  bgStars=[];
  const n=Math.floor(W*H/900);
  for(let i=0;i<n;i++) bgStars.push({
    x:Math.random()*W, y:Math.random()*H,
    r:Math.random()*1.5+0.15,
    a:Math.random()*0.65+0.1,
    ts:Math.random()*0.013+0.002,
    to:Math.random()*Math.PI*2,
    layer:Math.random()<0.45?0:1,
  });
}

function buildNebulae(){
  nebulae=[
    {cx:.20,cy:.30,rx:.38,ry:.24,c:'rgba(179,27,27,.13)'},
    {cx:.72,cy:.52,rx:.30,ry:.20,c:'rgba(120,10,10,.11)'},
    {cx:.50,cy:.08,rx:.45,ry:.14,c:'rgba(160,20,20,.10)'},
    {cx:.12,cy:.70,rx:.24,ry:.20,c:'rgba(140,30,10,.09)'},
    {cx:.85,cy:.22,rx:.28,ry:.18,c:'rgba(100,15,15,.12)'},
    {cx:.60,cy:.80,rx:.32,ry:.16,c:'rgba(180,40,10,.08)'},
  ].map(n=>({...n,x:n.cx*W,y:n.cy*H,rX:n.rx*W,rY:n.ry*H}));
}

// ────────────────────────────────────────────────────
//  DB ROW → WISH OBJECT
// ────────────────────────────────────────────────────
function dbToWish(row, fresh=false){
  // Calculate how far this wish has drifted since creation (cap at 8 min)
  const MAX_FRAMES = 28800;
  const elapsed = fresh ? 0 : Math.min((Date.now()-row.born)/(1000/60), MAX_FRAMES);
  return {
    id:        row.id,
    name:      row.name,
    text:      row.text,
    type:      STAR_TYPES[row.type_idx] || STAR_TYPES[0],
    size:      row.size,
    wobbleOff: row.wobble_off,
    wobbleAmp: row.wobble_amp,
    twinkleOff:row.twinkle_off,
    wx:        row.wx + row.vx * elapsed,
    wy:        row.wy + row.vy * elapsed,
    vx:        row.vx,
    vy:        row.vy,
    born:      row.born,
    age:       fresh ? 0 : 9999,
    opacity:   fresh ? 0 : 1,
  };
}

// ────────────────────────────────────────────────────
//  DRAW WISH PLANET
// ────────────────────────────────────────────────────
function drawWishPlanet(w, sc, alpha){
  const t = w.type;
  const sz = w.size * zoom;
  const twinkle = 0.88 + 0.12*Math.sin(frame*0.035+w.twinkleOff);
  const eff = sz * twinkle;

  ctx.save();
  ctx.globalAlpha = alpha;

  // outer soft nebula glow
  const og = ctx.createRadialGradient(sc.x,sc.y,0,sc.x,sc.y,eff*5.5);
  og.addColorStop(0,   ha(t.outer,.28));
  og.addColorStop(.4,  ha(t.outer,.10));
  og.addColorStop(1,   'transparent');
  ctx.fillStyle=og; ctx.beginPath(); ctx.arc(sc.x,sc.y,eff*5.5,0,Math.PI*2); ctx.fill();

  // mid glow
  const mg = ctx.createRadialGradient(sc.x,sc.y,0,sc.x,sc.y,eff*2.6);
  mg.addColorStop(0,  ha(t.mid,.85));
  mg.addColorStop(.5, ha(t.mid,.35));
  mg.addColorStop(1,  'transparent');
  ctx.fillStyle=mg; ctx.beginPath(); ctx.arc(sc.x,sc.y,eff*2.6,0,Math.PI*2); ctx.fill();

  // planet body
  const pg = ctx.createRadialGradient(sc.x-eff*.25,sc.y-eff*.25,eff*.1,sc.x,sc.y,eff);
  pg.addColorStop(0,   t.core);
  pg.addColorStop(.55, t.mid);
  pg.addColorStop(1,   t.outer);
  ctx.shadowColor=t.mid; ctx.shadowBlur=eff*1.8;
  ctx.fillStyle=pg; ctx.beginPath(); ctx.arc(sc.x,sc.y,eff,0,Math.PI*2); ctx.fill();

  // ring (for some types)
  if(t.ring && zoom>0.22){
    ctx.shadowBlur=0;
    ctx.strokeStyle=ha(t.mid,.38);
    ctx.lineWidth=eff*.35;
    ctx.beginPath();
    ctx.ellipse(sc.x,sc.y,eff*2.1,eff*.5,Math.PI/6,0,Math.PI*2);
    ctx.stroke();
  }

  // 4-point sparkle (only when zoomed in enough)
  if(zoom>0.3){
    const spk=eff*3.2*twinkle;
    ctx.shadowColor=t.core; ctx.shadowBlur=eff*1.2;
    ctx.strokeStyle=ha(t.core,.55);
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(sc.x-spk,sc.y); ctx.lineTo(sc.x+spk,sc.y);
    ctx.moveTo(sc.x,sc.y-spk); ctx.lineTo(sc.x,sc.y+spk);
    ctx.stroke();
  }

  ctx.restore();

  // name label
  if(zoom>0.28 && alpha>0.3){
    ctx.save();
    ctx.globalAlpha = alpha * Math.min(1,(zoom-0.28)*4);
    ctx.font=`600 ${Math.max(9,11*zoom)}px 'Cinzel',serif`;
    ctx.textAlign='center';
    ctx.fillStyle=ha(t.mid,.95);
    ctx.shadowColor=t.outer; ctx.shadowBlur=10;
    ctx.fillText(w.name, sc.x, sc.y - eff*1.6 - 6);
    ctx.restore();
  }

  // wish text — appears when zoomed in close
  if(zoom>0.6 && alpha>0.3){
    const textAlpha = alpha * Math.min(1,(zoom-0.6)*3);
    ctx.save();
    ctx.globalAlpha = textAlpha;
    ctx.textAlign='center';
    ctx.shadowColor=t.outer; ctx.shadowBlur=6;

    const fontSize = Math.max(10, 10*zoom);
    ctx.font=`italic 300 ${fontSize}px 'Cormorant Garamond',Georgia,serif`;
    ctx.fillStyle=ha(t.core,.88);

    // word-wrap to ~220px at current zoom
    const maxW = Math.max(140, 220*zoom);
    const words = w.text.split(' ');
    const lines = [];
    let line = '';
    for(const word of words){
      const test = line ? line+' '+word : word;
      if(ctx.measureText(test).width > maxW && line){
        lines.push(line); line = word;
      } else { line = test; }
    }
    if(line) lines.push(line);
    // cap at 4 lines
    const shown = lines.slice(0,4);
    if(lines.length>4) shown[3] = shown[3].replace(/\s*\w+$/, '…');

    const lineH = fontSize * 1.45;
    const startY = sc.y + eff*1.55 + fontSize;
    shown.forEach((l,i) => ctx.fillText(l, sc.x, startY + i*lineH));
    ctx.restore();
  }
}

// ────────────────────────────────────────────────────
//  PARTICLES  (release burst)
// ────────────────────────────────────────────────────
function burst(sx,sy,color){
  for(let i=0;i<28;i++){
    const a=Math.random()*Math.PI*2;
    const sp=1+Math.random()*5;
    particles.push({x:sx,y:sy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      r:.8+Math.random()*2.2,life:1,decay:.018+Math.random()*.018,color});
  }
}
function updateParticles(){
  particles=particles.filter(p=>{
    p.x+=p.vx; p.y+=p.vy; p.vy+=.035; p.life-=p.decay; return p.life>0;
  });
}

// ────────────────────────────────────────────────────
//  MAIN DRAW LOOP
// ────────────────────────────────────────────────────
function draw(){
  // update wish drifts
  const now=Date.now();
  wishList.forEach(w=>{
    w.age++;
    w.opacity=Math.min(1,w.age/60);
    const wobble=Math.sin(now*.0004+w.wobbleOff)*w.wobbleAmp;
    w.wx+=w.vx+wobble;
    w.wy+=w.vy;
    // very slow world scroll — wrap vertically in a huge band
    // (let them drift far; no forced wrapping)
  });
  updateParticles();

  ctx.clearRect(0,0,W,H);

  // ── deep space background ──
  const bg=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.85);
  bg.addColorStop(0,'#0a0000'); bg.addColorStop(.5,'#000000'); bg.addColorStop(1,'#000000');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  // Milky Way band
  const mw=ctx.createLinearGradient(0,H*.2,W,H*.8);
  mw.addColorStop(0,'transparent');
  mw.addColorStop(.35,'rgba(179,27,27,.04)');
  mw.addColorStop(.5,'rgba(200,40,40,.06)');
  mw.addColorStop(.65,'rgba(179,27,27,.04)');
  mw.addColorStop(1,'transparent');
  ctx.fillStyle=mw; ctx.fillRect(0,0,W,H);

  // ── nebulae ──
  nebulae.forEach(n=>{
    const big=Math.max(n.rX,n.rY);
    const g=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,big);
    g.addColorStop(0,n.c); g.addColorStop(1,'transparent');
    ctx.save();
    ctx.scale(n.rX/big,n.rY/big);
    ctx.fillStyle=g; ctx.beginPath();
    ctx.arc(n.x*big/n.rX,n.y*big/n.rY,big,0,Math.PI*2); ctx.fill();
    ctx.restore();
  });

  // ── bg stars (parallax) ──
  bgStars.forEach(s=>{
    const px=s.layer===0?.045:.14;
    const sx=((s.x+panX*px*zoom)%W+W)%W;
    const sy=((s.y+panY*px*zoom)%H+H)%H;
    const tw=.5+.5*Math.sin(frame*s.ts+s.to);
    ctx.beginPath(); ctx.arc(sx,sy,s.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,235,235,${s.a*(.5+.5*tw)})`; ctx.fill();
  });

  // ── wish planets ──
  wishList.forEach(w=>{
    const sc=w2s(w.wx,w.wy);
    const margin=w.size*zoom*8+80;
    if(sc.x<-margin||sc.x>W+margin||sc.y<-margin||sc.y>H+margin) return;
    drawWishPlanet(w,sc,w.opacity);
  });

  // ── particles ──
  particles.forEach(p=>{
    ctx.save(); ctx.globalAlpha=p.life;
    ctx.fillStyle=p.color; ctx.shadowColor=p.color; ctx.shadowBlur=8;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); ctx.restore();
  });

  frame++;
  requestAnimationFrame(draw);
}

// ────────────────────────────────────────────────────
//  COUNTER
// ────────────────────────────────────────────────────
function updateCounter(){
  const n=wishList.length;
  document.getElementById('counter-num').textContent = `Big Red Wishes: ${n.toLocaleString()}`;




}

// ────────────────────────────────────────────────────
//  TOOLTIP
// ────────────────────────────────────────────────────
let ttTimer;
function showTT(w,x,y){
  const tt=document.getElementById('tooltip');
  document.getElementById('tt-name').textContent=w.name;
  document.getElementById('tt-wish').textContent='"'+w.text+'"';
  let tx=x+16,ty=y-16;
  if(tx+240>W)tx=x-240; if(ty+90>H)ty=y-90; if(ty<60)ty=y+20;
  tt.style.left=tx+'px'; tt.style.top=ty+'px';
  tt.classList.add('show');
  clearTimeout(ttTimer); ttTimer=setTimeout(hideTT,5000);
}
function hideTT(){ document.getElementById('tooltip').classList.remove('show'); }

// ────────────────────────────────────────────────────
//  RELEASE (submit → POST to server)
// ────────────────────────────────────────────────────
let submitting = false;
document.getElementById('release-btn').addEventListener('click', async ()=>{
  const text=document.getElementById('wish-input').value.trim();
  if(!text){ document.getElementById('wish-input').focus(); return; }
  if(submitting) return;
  submitting=true;

  const name=document.getElementById('name-input').value.trim();
  const btn=document.getElementById('release-btn');
  btn.textContent='✦  Sending your wish…  ✦';
  btn.style.opacity='.7';

  try{
    const res=await fetch('/api/wishes',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ name, text, type_idx: Math.floor(Math.random()*6) }),
    });
    if(!res.ok) throw new Error(await res.text());
    const row=await res.json();

    // Add locally (WS will echo to other clients; we skip duplicate in onmessage)
    const w=dbToWish(row, true);
    wishList.push(w);
    updateCounter();
    burst(W/2, H-PANEL_H/2, w.type.mid);

    document.getElementById('wish-input').value='';
    document.getElementById('name-input').value='';
  }catch(err){
    console.error('wish failed:',err);
    alert('Could not send wish — is the server running?');
  }finally{
    btn.textContent='✦   Send a Big Red Wish   ✦';
    btn.style.opacity='';
    submitting=false;
  }
});

document.getElementById('wish-input').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); document.getElementById('release-btn').click(); }
});

// ────────────────────────────────────────────────────
//  MOUSE
// ────────────────────────────────────────────────────
canvas.addEventListener('mousemove',e=>{
  mouseX=e.clientX; mouseY=e.clientY;
  if(isDragging) return;
  let hit=null;
  for(const w of wishList){
    const sc=w2s(w.wx,w.wy);
    const dx=e.clientX-sc.x,dy=e.clientY-sc.y;
    const r=w.size*zoom*2.6+6;
    if(dx*dx+dy*dy<r*r){hit=w;break;}
  }
  if(hit){ canvas.style.cursor='pointer'; showTT(hit,e.clientX,e.clientY); }
  else   { canvas.style.cursor='default'; hideTT(); }
});

canvas.addEventListener('click',e=>{
  if(isDragging)return;
  for(const w of wishList){
    const sc=w2s(w.wx,w.wy);
    const dx=e.clientX-sc.x,dy=e.clientY-sc.y;
    const r=w.size*zoom*2.6+6;
    if(dx*dx+dy*dy<r*r){showTT(w,e.clientX,e.clientY);return;}
  }
});

// ── drag to pan ──
canvas.addEventListener('mousedown',e=>{
  // don't drag if clicking in the panel area
  if(e.clientY>H-PANEL_H)return;
  isDragging=false;
  dragStart={x:e.clientX,y:e.clientY}; panStart={x:panX,y:panY};
  window.addEventListener('mousemove',onDrag);
  window.addEventListener('mouseup',onDragEnd);
});
function onDrag(e){
  const dx=e.clientX-dragStart.x,dy=e.clientY-dragStart.y;
  if(Math.abs(dx)>4||Math.abs(dy)>4)isDragging=true;
  if(!isDragging)return;
  panX=panStart.x-dx/zoom; panY=panStart.y-dy/zoom;
}
function onDragEnd(){
  window.removeEventListener('mousemove',onDrag);
  window.removeEventListener('mouseup',onDragEnd);
  setTimeout(()=>{isDragging=false;},55);
}

// ── zoom ──
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  const f=e.deltaY>0?.9:1.11;
  const wx=(e.clientX-W/2)/zoom+panX, wy=(e.clientY-H/2)/zoom+panY;
  zoom=Math.min(MAX_ZOOM,Math.max(MIN_ZOOM,zoom*f));
  panX=wx-(e.clientX-W/2)/zoom; panY=wy-(e.clientY-H/2)/zoom;
},{passive:false});
document.getElementById('zin').addEventListener('click',()=>zoom=Math.min(MAX_ZOOM,zoom*1.3));
document.getElementById('zout').addEventListener('click',()=>zoom=Math.max(MIN_ZOOM,zoom*.77));
document.getElementById('zreset').addEventListener('click',()=>{zoom=1;panX=0;panY=0;});

// ── touch ──
let lastDist=0;
canvas.addEventListener('touchstart',e=>{
  if(e.touches.length===2){
    lastDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
  }else{
    isDragging=false;
    dragStart={x:e.touches[0].clientX,y:e.touches[0].clientY};
    panStart={x:panX,y:panY};
  }
},{passive:true});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(e.touches.length===2){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    zoom=Math.min(MAX_ZOOM,Math.max(MIN_ZOOM,zoom*d/lastDist)); lastDist=d;
  }else{
    const dx=e.touches[0].clientX-dragStart.x,dy=e.touches[0].clientY-dragStart.y;
    if(Math.abs(dx)>5||Math.abs(dy)>5)isDragging=true;
    if(isDragging){panX=panStart.x-dx/zoom;panY=panStart.y-dy/zoom;}
  }
},{passive:false});
canvas.addEventListener('touchend',e=>{
  if(!isDragging&&e.changedTouches.length===1){
    const t=e.changedTouches[0];
    for(const w of wishList){
      const sc=w2s(w.wx,w.wy);
      const dx=t.clientX-sc.x,dy=t.clientY-sc.y;
      const r=w.size*zoom*2.6+10;
      if(dx*dx+dy*dy<r*r){showTT(w,t.clientX,t.clientY);break;}
    }
  }
  setTimeout(()=>{isDragging=false;},55);
},{passive:true});

// ────────────────────────────────────────────────────
//  API  +  WEBSOCKET
// ────────────────────────────────────────────────────
async function loadWishes(){
  try{
    const rows=await (await fetch('/api/wishes')).json();
    rows.forEach(r=>wishList.push(dbToWish(r)));
    updateCounter();
  }catch(e){ console.warn('Could not load wishes:',e); }
}

function connectWS(){
  const proto=location.protocol==='https:'?'wss:':'ws:';
  const ws=new WebSocket(`${proto}//${location.host}`);

  ws.onmessage=e=>{
    const {event,data}=JSON.parse(e.data);
    if(event!=='wish') return;
    // skip if we already added it locally after our own POST
    if(wishList.some(w=>w.id===data.id)) return;
    const w=dbToWish(data,true);
    wishList.push(w);
    updateCounter();
  };

  ws.onclose=()=>setTimeout(connectWS, 3000); // auto-reconnect
  ws.onerror=err=>console.warn('ws error:',err);
}

// ── boot ──
resize();
requestAnimationFrame(draw);
loadWishes().then(connectWS);
</script>
